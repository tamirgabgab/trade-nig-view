[project]
name = "chartlab-backend"
version = "0.1.0"
description = "ChartLab backend: market data, indicators and analysis API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - personal use" }
dependencies = [
    "fastapi>=0.165,<1",
    # Plain uvicorn (pure Python, h11). The [standard] extras add unsigned native modules
    # (httptools, watchfiles, websockets) that Windows Smart App Control may block.
    "uvicorn>=0.54",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.7,<3",
    "httpx2>=2.16",
    "numpy>=2.2",
    "pandas>=3.0",
    # Pinned: yfinance is a reverse-engineered client; upgrade deliberately (see ADR 0006).
    "yfinance==1.8.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "pytest-cov>=6",
    "hypothesis>=6.170",
    "ruff>=0.17",
    "ta-lib>=0.6.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF", "PT", "PL", "NPY", "PERF", "ANN", "S",
]
ignore = [
    "PLR0913",  # many-args: indicator functions take several params by design
    "PLR0917",  # many positional args: OHLCV columns are naturally positional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PLR2004", "ANN401"]

[tool.pyright]
# pyright (not mypy): mypy 2.x needs the native librt module, which Windows Smart App Control
# blocks on the developer's machine. pyright runs on Node (signed) - see ADR 0001 amendment 2.
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["app"]
branch = true
