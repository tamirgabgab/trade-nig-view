# ChartLab symbol universe. Edit freely: order defines the watchlist order and sections.
# symbol   = provider symbol (Yahoo format)      display = short name shown in the UI
# type     = index | etf | stock | future | forex  group   = watchlist section
# has_volume = false for indices/forex (no real traded volume; use ETFs for volume work)
# Continuous futures (=F) contain roll gaps between contracts: expect artificial price gaps.
#   Their display names follow TradingView's continuous-contract tickers (GC1! = COMEX:GC1!).
# session_start = local "HH:MM" (in timezone, default America/New_York) when a trading session that
#   spans midnight starts: CME futures 18:00, ICE DXY 20:00, forex 17:00. Omit it for instruments
#   whose session lies within one calendar day. Used to group 1h bars into sessions (4h bars).

