name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Quality gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Windows runs the same PowerShell scripts the developer uses, under Windows PowerShell 5.1,
      # so script regressions surface in CI and not on the developer's machine.
      - name: Setup + all gates (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\setup.ps1
          .\scripts\test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The desktop shortcut runs update.ps1 before every start. Check it under PowerShell 5.1:
      # an up-to-date checkout and an unreachable remote must both exit 0 (keep the version on disk).
      - name: Update script (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\update.ps1
          if ($LASTEXITCODE -ne 0) { throw "update.ps1 failed on a normal checkout" }
          $url = git remote get-url origin
          git remote set-url origin https://invalid.example.invalid/none.git
          .\scripts\update.ps1
          $code = $LASTEXITCODE
          git remote set-url origin $url
          if ($code -ne 0) { throw "update.ps1 must not fail when the remote is unreachable" }

      # Every .ps1 must parse under Windows PowerShell 5.1: a parse error makes the desktop-shortcut
      # window close at once, before any error can be shown.
      - name: PowerShell scripts parse (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bad = 0
          foreach ($file in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($file.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad -gt 0) { throw "$bad PowerShell parse error(s)" }

      # Older installs sit on a claude/... work branch; update.ps1 must move them to 'main' when
      # that is safe, and stay put when local work would be lost.
      - name: Update script moves old installs to main (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $env:GIT_AUTHOR_NAME = 'ci'; $env:GIT_AUTHOR_EMAIL = 'ci@example.invalid'
          $env:GIT_COMMITTER_NAME = 'ci'; $env:GIT_COMMITTER_EMAIL = 'ci@example.invalid'
          $t = Join-Path $env:RUNNER_TEMP 'switch-test'
          git init -q --bare -b main "$t\remote.git"
          git clone -q "$t\remote.git" "$t\dev" 2>$null
          New-Item -ItemType Directory "$t\dev\scripts" | Out-Null
          Copy-Item scripts\update.ps1, scripts\_common.ps1 "$t\dev\scripts\"
          Set-Content "$t\dev\app.txt" 'v1'
          git -C "$t\dev" add -A; git -C "$t\dev" commit -qm init; git -C "$t\dev" push -q origin main
          git -C "$t\dev" switch -qc claude/old; Set-Content "$t\dev\app.txt" 'v2'
          git -C "$t\dev" commit -qam old; git -C "$t\dev" push -q origin claude/old
          git -C "$t\dev" switch -q main; git -C "$t\dev" merge -q --ff-only claude/old
          Set-Content "$t\dev\app.txt" 'v3'; git -C "$t\dev" commit -qam new; git -C "$t\dev" push -q origin main
          function Test-Case([string]$Name, [scriptblock]$Setup, [string]$Branch, [string]$Content) {
            if (Test-Path "$t\user") { Remove-Item -Recurse -Force "$t\user" }
            git clone -q -b claude/old "$t\remote.git" "$t\user" 2>$null
            New-Item -ItemType Directory "$t\user\backend\.venv", "$t\user\frontend\node_modules" | Out-Null
            Push-Location "$t\user"; & $Setup; Pop-Location
            & powershell -NoProfile -ExecutionPolicy Bypass -File "$t\user\scripts\update.ps1"
            if ($LASTEXITCODE -ne 0) { throw "${Name}: update.ps1 exit $LASTEXITCODE" }
            $b = "$(git -C "$t\user" rev-parse --abbrev-ref HEAD)".Trim()
            $c = "$(Get-Content "$t\user\app.txt")".Trim()
            if ($b -ne $Branch -or $c -ne $Content) { throw "${Name}: got $b/$c, expected $Branch/$Content" }
            Write-Host "PASS $Name" -ForegroundColor Green
          }
          Test-Case 'clean old branch moves to main' { } 'main' 'v3'
          Test-Case 'stale local main moves to main' { git branch -q main origin/main~1 } 'main' 'v3'
          Test-Case 'local changes stay' { Set-Content app.txt 'dirty' } 'claude/old' 'dirty'
          Test-Case 'unpushed commit stays' { Set-Content b.txt 'x'; git add b.txt; git commit -qm local } 'claude/old' 'v2'

      - name: Setup + all gates (bash)
        if: runner.os != 'Windows'
        run: |
          ./scripts/setup.sh
          ./scripts/test.sh
          ./scripts/update.sh

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end (Playwright, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: ./scripts/setup.sh

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Real backend (OFFLINE=1, synthetic fixtures in frontend/e2e/data) behind the Vite dev server.
      - name: Playwright
        working-directory: frontend
        run: npm run e2e -- --trace off

      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
