name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Quality gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Windows runs the same PowerShell scripts the developer uses, under Windows PowerShell 5.1,
      # so script regressions surface in CI and not on the developer's machine.
      - name: Setup + all gates (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\setup.ps1
          .\scripts\test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The desktop shortcut runs update.ps1 before every start. Check it under PowerShell 5.1:
      # an up-to-date checkout and an unreachable remote must both exit 0 (keep the version on disk).
      - name: Update script (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\update.ps1
          if ($LASTEXITCODE -ne 0) { throw "update.ps1 failed on a normal checkout" }
          $url = git remote get-url origin
          git remote set-url origin https://invalid.example.invalid/none.git
          .\scripts\update.ps1
          $code = $LASTEXITCODE
          git remote set-url origin $url
          if ($code -ne 0) { throw "update.ps1 must not fail when the remote is unreachable" }

      - name: Setup + all gates (bash)
        if: runner.os != 'Windows'
        run: |
          ./scripts/setup.sh
          ./scripts/test.sh
          ./scripts/update.sh

      - name: Frontend production build
        working-directory: frontend
        run: npm run build
